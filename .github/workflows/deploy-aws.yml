name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci --prefix frontend && npm run build --prefix frontend

      - name: Test and build backend
        run: ./backend/gradlew -p backend test bootJar

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::041794612561:role/intent-os-github-deploy' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: IntentOSGitHubDeploy

      - name: Upload frontend to private S3 origin
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET || 'intent-os-site-20261009163255858700000001' }}
        run: |
          test -n "$FRONTEND_BUCKET"
          aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET/" \
            --delete \
            --cache-control 'public,max-age=86400'
          aws s3 cp frontend/dist/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8'

      - name: Build and upload backend image archive
        env:
          ARTIFACT_BUCKET: ${{ vars.BACKEND_ARTIFACT_BUCKET || 'intent-os-deploy-20261009163255858700000002' }}
        run: |
          test -n "$ARTIFACT_BUCKET"
          docker build --file Dockerfile.backend --tag intentos-backend:${GITHUB_SHA} .
          docker save intentos-backend:${GITHUB_SHA} | gzip > backend-image.tar.gz
          aws s3 cp backend-image.tar.gz \
            "s3://$ARTIFACT_BUCKET/releases/${GITHUB_SHA}/backend-image.tar.gz"

      - name: Prepare deployment configuration
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://d16bwrbw919sxe.cloudfront.net' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          BACKEND_ARTIFACT_BUCKET: ${{ vars.BACKEND_ARTIFACT_BUCKET || 'intent-os-deploy-20261009163255858700000002' }}
          RUNTIME_PARAMETER_NAME: ${{ vars.RUNTIME_PARAMETER_NAME || '/intent-os/prod/backend-env' }}
          DEPLOYMENT_SHA: ${{ github.sha }}
          PAYPAL_ENVIRONMENT: ${{ vars.PAYPAL_ENVIRONMENT || 'sandbox' }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ vars.PAYPAL_WEBHOOK_ID || secrets.PAYPAL_WEBHOOK_ID || '' }}
          CHANNEL3_API_KEY: ${{ secrets.CHANNEL3_API_KEY }}
          PAYPAL_LOGIN_CLIENT_ID: ${{ secrets.PAYPAL_LOGIN_CLIENT_ID }}
          PAYPAL_LOGIN_CLIENT_SECRET: ${{ secrets.PAYPAL_LOGIN_CLIENT_SECRET }}
          INTENTOS_ELASTIC_ENABLED: ${{ vars.INTENTOS_ELASTIC_ENABLED || 'false' }}
          INTENTOS_ELASTIC_URL: ${{ vars.INTENTOS_ELASTIC_URL || '' }}
          INTENTOS_ELASTIC_SEMANTIC_FIELD: ${{ vars.INTENTOS_ELASTIC_SEMANTIC_FIELD || 'searchText' }}
          INTENTOS_ELASTIC_API_KEY: ${{ secrets.INTENTOS_ELASTIC_API_KEY }}
          ELASTIC_KIBANA_URL: ${{ vars.ELASTIC_KIBANA_URL || '' }}
          ELASTIC_AGENT_BUILDER_API_KEY: ${{ secrets.ELASTIC_AGENT_BUILDER_API_KEY }}
          ELASTIC_AGENT_BUILDER_AGENT_ID: ${{ vars.ELASTIC_AGENT_BUILDER_AGENT_ID || 'receipt-analyst' }}
          INTENTOS_LLM_ENABLED: ${{ vars.INTENTOS_LLM_ENABLED || 'true' }}
          INTENTOS_LLM_REGION: ${{ vars.INTENTOS_LLM_REGION || vars.AWS_REGION || 'us-east-1' }}
          INTENTOS_LLM_MODEL_EXTRACTION: ${{ vars.INTENTOS_LLM_MODEL_EXTRACTION || 'amazon.nova-micro-v1:0' }}
          INTENTOS_LLM_MODEL_REASONING: ${{ vars.INTENTOS_LLM_MODEL_REASONING || 'amazon.nova-lite-v1:0' }}
          INTENTOS_LLM_MODEL_REPAIR: ${{ vars.INTENTOS_LLM_MODEL_REPAIR || 'amazon.nova-lite-v1:0' }}
          INTENTOS_LLM_MODEL_EXPLANATION: ${{ vars.INTENTOS_LLM_MODEL_EXPLANATION || 'amazon.nova-micro-v1:0' }}
          INTENTOS_LLM_MAX_TOKENS: ${{ vars.INTENTOS_LLM_MAX_TOKENS || '700' }}
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=intent-os-backend' 'Name=instance-state-name,Values=running' \
            --region "$AWS_REGION" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          if [[ ! "$instance_id" =~ ^i-[0-9a-f]+$ ]]; then
            echo "Expected one running intent-os-backend instance, got: $instance_id" >&2
            exit 1
          fi
          echo "BACKEND_INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"
          export BACKEND_INSTANCE_ID="$instance_id"
          node scripts/write-ec2-deployment.mjs

      - name: Store backend runtime secrets in Parameter Store
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          aws ssm put-parameter \
            --cli-input-json file://runtime-parameter.json \
            --region "$AWS_REGION" \
            >/dev/null

      - name: Wait for EC2 Systems Manager registration
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          for attempt in $(seq 1 40); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$BACKEND_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)
            if [ "$status" = Online ]; then exit 0; fi
            sleep 15
          done
          echo "EC2 did not become available in Systems Manager." >&2
          exit 1

      - name: Send backend deployment through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$BACKEND_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-command.json \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)
          for attempt in $(seq 1 40); do
            state=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$BACKEND_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$state" in
              Success) exit 0 ;;
              Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$BACKEND_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query StandardErrorContent \
                  --output text >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for EC2 SSM deployment." >&2
          exit 1

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || 'EVJKXZTK1HA3I' }}
        run: |
          test -n "$DISTRIBUTION_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            >/dev/null

      - name: Verify public API health
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://d16bwrbw919sxe.cloudfront.net' }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$PUBLIC_APP_URL/api/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "Application did not become healthy through CloudFront." >&2
          exit 1

      - name: Clean up generated deployment secrets
        if: always()
        run: rm -f runtime-parameter.json ssm-command.json backend-image.tar.gz