plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.intentos'
version = '0.1.0-SNAPSHOT'

description = 'IntentOS backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.41.4')
    implementation 'software.amazon.awssdk:bedrockruntime'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.modelcontextprotocol.sdk:mcp-spring-webmvc:0.18.5'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2:0.18.5'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
